openapi: 3.1.0
info:
  title: Telecommunications Churn Prediction API
  version: 1.0.0
  description: >-
    Synthetic-only churn scoring and governed model operations. Synthetic
    results are demonstrations, not commercial performance claims.
servers:
  - url: /
security:
  - accessAssertion: []
paths:
  /health/live:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: alive }
  /health/ready:
    get:
      summary: Approved-model readiness
      responses:
        '200':
          description: An approved model is ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: No approved model or a required service is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /v1/overview:
    get:
      summary: Dashboard overview
      x-required-role: any-approved-project-role
      responses:
        '200':
          description: User role, active model, and registry counts.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/model:
    get:
      summary: Active approved model metadata
      x-required-role: analyst
      responses:
        '200':
          description: Active model information or unavailable status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveModel' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/models:
    get:
      summary: List model candidates and approvals
      x-required-role: ml_operator, approver
      responses:
        '200':
          description: Model registry records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelRecord' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/models/candidates:
    post:
      summary: Register a trained candidate artifact
      description: Training runs locally. Only candidates with a matching checksum and the current schema can be uploaded.
      x-required-role: ml_operator
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest_json, artifact]
              properties:
                manifest_json: { type: string, description: JSON model manifest }
                artifact: { type: string, format: binary }
      responses:
        '200':
          description: Candidate registered and awaiting an independent approval.
          content:
            application/json:
              schema:
                type: object
                required: [model, registered_by, approval_required]
                properties:
                  model: { $ref: '#/components/schemas/ModelRecord' }
                  registered_by: { type: string, format: email }
                  approval_required: { const: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/predictions:
    post:
      summary: Score one synthetic customer snapshot
      x-required-role: analyst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer]
              properties:
                customer: { $ref: 'data-schema-v1.json#/$defs/inferenceSnapshot' }
      responses:
        '200':
          description: Churn probability, risk band, threshold, and model-behavior factors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prediction' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/predictions/batch:
    post:
      summary: Validate and score a bounded batch of synthetic snapshots
      x-required-role: analyst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [row_id, customer]
                    properties:
                      row_id: { type: string, maxLength: 128 }
                      customer: { $ref: 'data-schema-v1.json#/$defs/inferenceSnapshot' }
      responses:
        '200':
          description: Per-row predictions or validation errors; no row is silently dropped.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, model_version, scored_at, results]
                properties:
                  request_id: { type: string, format: uuid }
                  model_version: { type: string }
                  scored_at: { type: string, format: date-time }
                  results: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/models/{model_version}/approval:
    post:
      summary: Approve or reject a registered candidate
      x-required-role: approver
      parameters:
        - in: path
          name: model_version
          required: true
          schema: { type: string, pattern: '^model-[a-f0-9]{16}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, minLength: 8, maxLength: 2000 }
      responses:
        '200':
          description: Decision recorded with actor and previous model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalEvent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/models/rollback:
    post:
      summary: Restore a previously approved model
      x-required-role: approver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_version, reason]
              properties:
                model_version: { type: string, pattern: '^model-[a-f0-9]{16}$' }
                reason: { type: string, minLength: 8, maxLength: 2000 }
      responses:
        '200':
          description: Rollback recorded in the audit history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalEvent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/training-runs:
    get:
      summary: List locally trained reports available to this service
      x-required-role: ml_operator, approver
      responses:
        '200':
          description: Training reports; cloud training is not supported.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
    post:
      summary: Cloud training is intentionally disabled
      description: Train locally with churn-platform, then register the candidate artifact.
      x-required-role: ml_operator
      responses:
        '409': { $ref: '#/components/responses/Error' }
  /v1/monitoring/summary:
    get:
      summary: Read request, error, model, and signal-limit summaries
      x-required-role: ml_operator, approver
      responses:
        '200':
          description: Monitoring summary with explicit synthetic-data limitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringSummary' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/quota:
    get:
      summary: Read this project's monthly API request quota
      description: Worker endpoint; the quota does not cap the Cloudflare account invoice.
      responses:
        '200':
          description: Configured limit, used requests, and remaining requests.
          content:
            application/json:
              schema:
                type: object
                required: [month, limit, requests, remaining]
                properties:
                  month: { type: string, pattern: '^\d{4}-\d{2}$' }
                  limit: { type: integer, minimum: 1 }
                  requests: { type: integer, minimum: 0 }
                  remaining: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    accessAssertion:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access JWT. In production, Access supplies this header after email PIN sign-in.
  responses:
    Error:
      description: Request was rejected or a required service is unavailable.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: {}
              error: { type: string }
              request_id: { type: string, format: uuid }
  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ready, not_ready] }
        environment: { type: string }
        active_model_version: { type: [string, 'null'] }
    ActiveModel:
      type: object
      required: [environment, status, model_version]
      properties:
        environment: { type: string }
        status: { type: string, enum: [approved, unavailable] }
        model_version: { type: [string, 'null'] }
        dataset_version: { type: [string, 'null'] }
        threshold: { type: [number, 'null'], minimum: 0, maximum: 1 }
        metrics: { type: object, additionalProperties: { type: number } }
    ModelRecord:
      type: object
      properties:
        model_version: { type: string }
        run_id: { type: string }
        dataset_version: { type: string }
        state: { type: string, enum: [pending_approval, approved, rejected] }
        manifest: { type: object }
        created_at: { type: string, format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        approved_by: { type: [string, 'null'] }
    Prediction:
      type: object
      required: [request_id, customer_id, churn_probability, risk_band, threshold, model_version, scored_at, environment, factors]
      properties:
        request_id: { type: string, format: uuid }
        customer_id: { type: string, pattern: '^SYN-' }
        churn_probability: { type: number, minimum: 0, maximum: 1 }
        risk_band: { type: string, enum: [low, watch, high] }
        threshold: { type: number, minimum: 0, maximum: 1 }
        model_version: { type: string }
        scored_at: { type: string, format: date-time }
        environment: { type: string }
        factors:
          type: array
          description: Model-behavior explanation, not causal evidence.
          items: { type: object }
    ApprovalEvent:
      type: object
      required: [model_version, decision, reason, actor, previous_model_version, timestamp]
      properties:
        model_version: { type: string }
        decision: { type: string, enum: [approve, reject, rollback] }
        reason: { type: string }
        actor: { type: string, format: email }
        previous_model_version: { type: [string, 'null'] }
        timestamp: { type: string, format: date-time }
    MonitoringSummary:
      type: object
      required: [environment, request_count, error_rate, active_model_version, input_quality, drift_signals, labeled_performance, signal_limitations]
      properties:
        environment: { type: string }
        request_count: { type: integer, minimum: 0 }
        error_rate: { type: number, minimum: 0, maximum: 1 }
        active_model_version: { type: [string, 'null'] }
        input_quality: { type: object }
        drift_signals: { type: array, items: { type: object } }
        labeled_performance: { type: [object, 'null'] }
        signal_limitations: { type: array, items: { type: string } }
